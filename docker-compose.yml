name: saba-leads

services:
  # Postgres con pgvector para desarrollo y tests locales.
  # En stg/prod la base es Supabase: solo cambia DATABASE (apps/api/.env).
  db:
    image: pgvector/pgvector:pg16
    container_name: saba-leads-db
    restart: unless-stopped
    # Valores del `.env` de la raíz (docker compose lo lee solo); sin él,
    # estos defaults. Si se cambian, `DATABASE_LOCAL` de apps/api/.env tiene
    # que coincidir.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app_dev}
    ports:
      # 5433 en el host a propósito. En Windows, un Postgres instalado en la
      # máquina también escucha en 0.0.0.0:5432 y se queda con las conexiones a
      # `localhost:5432`: el contenedor se ve sano y la API falla la
      # autenticación contra la base equivocada. Verificado en la máquina de
      # desarrollo. Dentro de la red de Docker el puerto sigue siendo el 5432.
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
