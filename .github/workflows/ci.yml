name: CI

on:
  push:
    branches: [main, development]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Variable pública embebida en el bundle del cliente en build time; en CI solo
  # tiene que ser una URL válida para que el build no falle.
  NEXT_PUBLIC_API_URL: http://localhost:8080

jobs:
  verify:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest

    # Las actions van pinneadas al SHA del commit, no al tag: la política de
    # Actions de la organización lo exige, y es la única forma de que `v4` no
    # signifique algo distinto mañana. El comentario dice qué release es cada
    # una; para actualizarlas, resolver el tag nuevo con
    # `gh api repos/actions/<action>/git/ref/tags/<tag>`.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Los tests de integración corren contra Postgres real (no un doble): el
      # mismo stack local de Supabase que en desarrollo (`supabase/config.toml`,
      # Postgres en :54332). El globalSetup de Vitest crea la base de tests y
      # migra. Studio y pg-meta no hacen falta en CI.
      - name: Supabase local
        run: npx supabase start -x studio,postgres-meta

      - name: Formato y lint
        run: npm run format-and-lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
